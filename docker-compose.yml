services:
  api:
    build:
      context: ./WikiLive.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: "-config=/etc/config.conf"
    configs:
      - source: config
        target: /etc/config.conf
        mode: 0444
    environment:
      - PORT=8080
      - DB_URL=jdbc:postgresql://db:5432/wiki
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=wiki
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

configs:
  config:
    file: ./WikiLive.Api/src/main/resources/application.conf
